name: Auto Merge PRs

# Who gets merged without a human look:
#  * the owner's own PRs from a branch of this repo (never a fork);
#  * Dependabot updates of dev tooling and GitHub Actions. Updates to packages
#    the live site runs (production dependencies) wait for the owner, because a
#    hijacked package would otherwise reach production, next to the service-role
#    key, within minutes.
# Anyone else's PR (forks included) is never auto-merged. This workflow never
# checks out or runs PR code, and it merges only the exact commit that passed.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  automerge:
    name: Auto Merge
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == github.repository_owner ||
       github.event.pull_request.user.login == 'dependabot[bot]')
    steps:
      - name: Read the Dependabot update
        id: deps
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Held unless EVERY package in the PR is dev tooling or a GitHub Action
      # (grouped PRs carry several; the single-value outputs describe only one).
      - name: Leave production dependency updates for a human
        id: hold
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          NAMES: ${{ steps.deps.outputs.dependency-names }}
          DEPS: ${{ steps.deps.outputs.updated-dependencies-json }}
        run: |
          if echo "${DEPS:-[]}" | jq -e 'length > 0 and all(.[]; .dependencyType == "direct:development" or .packageEcosystem == "github_actions")' > /dev/null; then
            echo "Dev tooling or GitHub Actions only: can merge once checks pass."
          else
            echo "::notice::This updates a package the live site runs ($NAMES). Review and merge it by hand."
            echo "hold=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for checks and the Vercel build, then merge if all passed
        if: steps.hold.outputs.hold != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -e
          # Vercel reports through commit *statuses*, not check-runs, so both
          # must be inspected. A Vercel status is required: merging before it
          # appears is how broken builds previously reached main.
          for i in $(seq 1 80); do
            CHECKS=$(gh api "repos/$REPO/commits/$SHA/check-runs" --jq '[.check_runs[] | select(.name != "Auto Merge")]')
            STATUSES=$(gh api "repos/$REPO/commits/$SHA/status" --jq '.statuses')
            VERCEL=$(echo "$STATUSES" | jq '[.[] | select(.context | startswith("Vercel"))]')

            if [ "$(echo "$VERCEL" | jq 'length')" -eq 0 ]; then
              echo "Waiting for the Vercel build to report..."
              sleep 15
              continue
            fi

            # CI (.github/workflows/ci.yml) must have run on this commit too.
            if [ "$(echo "$CHECKS" | jq '[.[] | select(.name == "Typecheck, lint, test")] | length')" -eq 0 ]; then
              echo "Waiting for CI to start..."
              sleep 15
              continue
            fi

            PENDING=$(( $(echo "$CHECKS" | jq '[.[] | select(.status != "completed")] | length') \
                      + $(echo "$STATUSES" | jq '[.[] | select(.state == "pending")] | length') ))
            if [ "$PENDING" -gt 0 ]; then
              echo "Waiting for $PENDING check(s)/status(es) to finish..."
              sleep 15
              continue
            fi

            FAILED=$(( $(echo "$CHECKS" | jq '[.[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length') \
                     + $(echo "$STATUSES" | jq '[.[] | select(.state != "success")] | length') ))
            if [ "$FAILED" -gt 0 ]; then
              echo "One or more checks or the Vercel build failed. Not merging."
              exit 1
            fi

            echo "All checks and the Vercel build passed. Merging."
            # --match-head-commit: merge only the commit that just passed, so a
            # commit pushed during the wait can't ride along unchecked.
            gh pr merge --squash --delete-branch --match-head-commit "$SHA" "$PR_URL"
            exit 0
          done
          echo "Timed out waiting for checks (20 min). Not merging."
          exit 1
